# AWS Secrets Manager
spring.config.import=aws-secretsmanager:stage/scheduler-service

spring.datasource.activityevents.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.activityevents.pool-name=activity-db-pool
spring.datasource.activityevents.maximum-pool-size=30
spring.datasource.activityevents.minimum-idle=10
spring.datasource.activityevents.connection-timeout=5000
scheduler.activity-db.schema=user_activity_service


spring.temporal.connection.target=localhost:7233

# WhatsApp Alert Configuration
com.whatsapp.template.name=1_bookings

# Wallet-expiry notification enqueue (30/7/4/1 days before tbl_user.wallet_min expires)
com.yesmadam.wallet-expiry-reminder.day-offsets=30,7,4,1
com.yesmadam.wallet-expiry-reminder.queue-url=https://sqs.ap-south-1.amazonaws.com/098102135019/wallet-expiry-notification-1-day-preprod

# Coupon-WhatsApp enqueue (yesterday's completed orders' claimed brand coupons)
com.yesmadam.coupon-whatsapp-reminder.queue-url=https://sqs.ap-south-1.amazonaws.com/098102135019/coupon-whatsapp-reminder-stage

passbookmismatch.mail.recipients=amandeep.saini@yesmadam.in
commissionaudit.mail.recipients=amandeep.saini@yesmadam.in

com.api.yesmadam.base.url=https://api-stage-aws.yesmadam.co.in/
com.api.yesmadam.assign-sp-to-neworder=userapi/order/assign-sp-to-neworder
com.api.yesmadam.admin.base.url=https://uat-admin.yesmadam.com/
com.api.yesmadam.distribute-job-batch=api/yesmadam/distribute-job-batch

producthublivestock.mail.recipients=amandeep.saini@yesmadam.in
producthublivestock.whatsapp.numbers=9815762153

sqs.fifo-queues.sp-tomorrow-job-reminder-clevertap=https://sqs.ap-south-1.amazonaws.com/098102135019/stage-sp-tomorrow-job-reminder-clevertap.fifo

# Credentials default to empty so the service can deploy before the credentials
# land in Secrets Manager. Every schedule is created paused, so nothing reaches SAP
# until a job is triggered; CinntraCredentialCheck logs a warning at startup if any
# value is still blank.
# Cinntra (SAP B1 Service Layer) — used by cinntra-login-and-store-session and elite-mismatch-sync
com.cinntra.url=http://172.31.6.232:50001/b1s/v1/
com.cinntra.key=${CINNTRA_KEY:}
com.cinntra.userId=${CINNTRA_USER_ID:}
com.cinntra.sap.username=${CINNTRA_SAP_USERNAME:}
com.cinntra.sap.password=${CINNTRA_SAP_PASSWORD:}
com.cinntra.sap.companydb=${CINNTRA_SAP_COMPANYDB:}
