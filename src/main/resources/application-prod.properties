# Credentials default to empty so the service can deploy before the credentials
# land in Secrets Manager. Every schedule is created paused, so nothing reaches SAP
# until a job is triggered; CinntraCredentialCheck logs a warning at startup if any
# value is still blank.
# Cinntra (SAP B1 Service Layer) — used by cinntra-login-and-store-session and elite-mismatch-sync
com.cinntra.url=http://172.31.6.232:50001/b1s/v1/
com.cinntra.key=${CINNTRA_KEY:}
com.cinntra.userId=${CINNTRA_USER_ID:}
com.cinntra.sap.username=${CINNTRA_SAP_USERNAME:}
com.cinntra.sap.password=${CINNTRA_SAP_PASSWORD:}
com.cinntra.sap.companydb=${CINNTRA_SAP_COMPANYDB:}
