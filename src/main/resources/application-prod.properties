# application-prod.properties
temporal.server.target=vm-ip:7233
# db config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# WhatsApp Alert Configuration
com.whatsapp.template.name=1_bookings
com.whatsapp.alert.whatsappNumbers=${WHATSAPP_NUMBERS}
#tata
com.tata.sms.send.url=${WHATSAPP_URL}
com.tata.sms.auth-key.token=${WHATSAPP_TOKEN}
