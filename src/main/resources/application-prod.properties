spring.config.import=aws-secretsmanager:prod/scheduler-service

spring.datasource.activityevents.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.activityevents.pool-name=activity-db-pool
spring.datasource.activityevents.maximum-pool-size=30
spring.datasource.activityevents.minimum-idle=10
spring.datasource.activityevents.connection-timeout=5000
scheduler.activity-db.schema=ysmdm_admin



spring.temporal.connection.target=${TEMPORAL_SERVER_TARGET:localhost:7233}
spring.temporal.namespace=${TEMPORAL_NAMESPACE:prod}

