spring.application.name=scheduler-service

# MySQL Database Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none

# Temporal

temporal.namespace=default

# Task Queues

temporal.taskqueue.booking=booking-task-queue
temporal.taskqueue.packageexpiry=package-expiry-task-queue


# Schedule IDs

temporal.schedule.booking=booking-count-schedule
temporal.schedule.packageexpiry=package-expiry-schedule


# Cron Expressions

temporal.cron.booking=* * * * *

temporal.cron.packageexpiry=10 0 * * *
 spring.jpa.show-sql=true

# Booking Monitor Temporal Configuration
temporal.taskqueue.bookingmonitor=booking-monitor-task-queue
temporal.schedule.bookingmonitor=booking-monitor-schedule
temporal.cron.bookingmonitor=* 9-23 * * *