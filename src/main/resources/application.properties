spring.application.name=scheduler-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/test_db
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Temporal

temporal.server.target=localhost:7233

temporal.namespace=default

# Task Queues

temporal.taskqueue.booking=booking-task-queue

# Schedule IDs

temporal.schedule.booking=booking-count-schedule

# Cron Expressions

temporal.cron.booking=* * * * *

temporal.cron.payment=0 * * * *

temporal.cron.reminder=0 9 * * *
