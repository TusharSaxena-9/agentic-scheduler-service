spring.application.name=scheduler-service
server.port=8060
management.server.port=9090

aws.secretsmanager.region=ap-south-1

# SQS credentials for AwsSqsConfig — same value in every environment, sourced from real process
# env vars (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_REGION, themselves from Secrets Manager),
# so defined once here rather than duplicated as a literal secret per environment.
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:ap-south-1}

# Declared scheduled jobs. Reconciled into Temporal on startup by ScheduleReconciler.
spring.config.import=classpath:schedules.yml

# Database (MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Reader/writer datasource pools (URLs and credentials are set per environment).
# Transactions marked readOnly route to the reader pool; everything else uses the writer.
spring.datasource.reader.pool-name=reader-db-pool
spring.datasource.reader.read-only=true
spring.datasource.reader.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.reader.maximum-pool-size=30
spring.datasource.reader.minimum-idle=10
spring.datasource.reader.connection-timeout=30000
spring.datasource.reader.auto-commit=true
spring.datasource.reader.leak-detection-threshold=600000

spring.datasource.writer.pool-name=writer-db-pool
spring.datasource.writer.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.writer.maximum-pool-size=30
spring.datasource.writer.minimum-idle=10
spring.datasource.writer.connection-timeout=30000
spring.datasource.writer.auto-commit=true
spring.datasource.writer.leak-detection-threshold=600000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Temporal (core) — connection target is set per environment.
# Workers, clients, and SDK metrics are auto-configured by the Temporal Spring Boot starter;
# workflows/activities are discovered via @WorkflowImpl/@ActivityImpl annotations.
spring.temporal.namespace=uat
spring.temporal.workers-auto-discovery.packages=com.yesmadam.schedulerservice

# Temporal task queues — one per resource-contention profile, NOT one per job.
temporal.taskqueue.light=scheduler-light
temporal.taskqueue.standard=scheduler-standard
temporal.taskqueue.heavy=scheduler-heavy
temporal.taskqueue.notification=scheduler-notification

spring.temporal.workers[0].task-queue=${temporal.taskqueue.light}
spring.temporal.workers[0].name=scheduler-light
spring.temporal.workers[0].capacity.max-concurrent-activity-executors=100
spring.temporal.workers[0].capacity.max-concurrent-workflow-task-executors=100
spring.temporal.workers[0].capacity.max-concurrent-activity-task-pollers=5
spring.temporal.workers[0].capacity.max-concurrent-workflow-task-pollers=5

spring.temporal.workers[1].task-queue=${temporal.taskqueue.standard}
spring.temporal.workers[1].name=scheduler-standard
spring.temporal.workers[1].capacity.max-concurrent-activity-executors=40
spring.temporal.workers[1].capacity.max-concurrent-workflow-task-executors=60
spring.temporal.workers[1].capacity.max-concurrent-activity-task-pollers=3
spring.temporal.workers[1].capacity.max-concurrent-workflow-task-pollers=3

spring.temporal.workers[2].task-queue=${temporal.taskqueue.heavy}
spring.temporal.workers[2].name=scheduler-heavy
spring.temporal.workers[2].capacity.max-concurrent-activity-executors=6
spring.temporal.workers[2].capacity.max-concurrent-workflow-task-executors=20
spring.temporal.workers[2].capacity.max-concurrent-activity-task-pollers=2
spring.temporal.workers[2].capacity.max-concurrent-workflow-task-pollers=2

spring.temporal.workers[3].task-queue=${temporal.taskqueue.notification}
spring.temporal.workers[3].name=scheduler-notification
spring.temporal.workers[3].capacity.max-concurrent-activity-executors=20
spring.temporal.workers[3].capacity.max-concurrent-workflow-task-executors=20
spring.temporal.workers[3].capacity.max-concurrent-activity-task-pollers=2
spring.temporal.workers[3].capacity.max-concurrent-workflow-task-pollers=2

temporal.schedule.defaults.time-zone=Asia/Kolkata
temporal.schedule.defaults.overlap-policy=SCHEDULE_OVERLAP_POLICY_SKIP
temporal.schedule.defaults.catchup-window=PT5M
temporal.schedule.defaults.jitter=PT1M
temporal.schedule.defaults.run-timeout=PT1H
temporal.schedule.defaults.pause-on-failure=false
temporal.schedule.defaults.create-paused=true


passbookmismatch.lookback.minutes=30
passbookmismatch.mail.from=support@yesmadam.com

producthublivestock.mail.from=support@yesmadam.com
producthublivestock.whatsapp.template.name=inventory_oos

# Rain-delay notification. Push via CleverTap (shared cleaver.tap.* credentials).
raindelay.enabled=false
raindelay.weather.base-url=https://api.weatherapi.com/v1/current.json
raindelay.weather.api-key=${WEATHER_API_KEY:}
raindelay.clevertap.event-name=Rain_Delay_Push
raindelay.clevertap.title=Rain in your area
raindelay.clevertap.body=Your professional may be slightly delayed. They're on the way \u2014 track live status in the app.
raindelay.deeplink-prefix=https://www.yesmadam.com/share?deeplinkCode=27&orderId=

feedbackreminder.whatsapp.template.name=service_feedback_rating
# Same in every environment: the "Rate Now" button's URL is the approved template's own public link, not a per-env endpoint.
feedbackreminder.whatsapp.rate-now.base-url=https://www.yesmadam.com/share?deeplinkCode=27&orderId=

spring.mail.host=email-smtp.ap-south-1.amazonaws.com
spring.mail.port=465
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=false

com.api.yesmadam.base.url=https://api-stage-aws.yesmadam.co.in/
com.api.yesmadam.assign-sp-to-neworder=userapi/order/assign-sp-to-neworder
com.api.yesmadam.admin.base.url=https://uat-admin.yesmadam.com/
com.api.yesmadam.distribute-job-batch=api/yesmadam/distribute-job-batch
cron.secret.key=${CRON_SECRET_KEY:}

# CleverTap secrets for sending user notification
cleaver.tap.user.product.id=${CLEVERTAP_USER_PRODUCT_ID:}
cleaver.tap.user.passcode=${CLEVERTAP_USER_PASSCODE:}
spnotreachedhome.distance.threshold.metres=300

sp.availability.auto-on.batch-size=200
sp.availability.auto-on.clevertap.event-name=SP_Campaign_Push
sp.availability.auto-on.clevertap.pop-title=Aap jobs ke liye LIVE hain \uD83D\uDEA8
sp.availability.auto-on.clevertap.pop-description=\uD83E\uDDF3 Aapki KIT issue ho gayi hai aur...\n\uD83D\uDCF2 Aapki availability ON ho chuki hai. App open karein aur orders accept karein \u2705

# Ozuzu order sync — same Unicommerce tenant across every environment, so no per-profile override
# (matches messagingapis' own application-*.properties, where this base URL was also constant).
# Credentials are env-var-backed, not literals, per rule 21; OzuzuUnicommerceClient fails fast at
# startup if they are still blank.
ozuzuorder.lookback-minutes=20
ozuzuorder.unicommerce.base-url=https://mayagbeauty.unicommerce.co.in/
ozuzuorder.unicommerce.token-url=oauth/token
ozuzuorder.unicommerce.search-orders-url=services/rest/v1/oms/saleOrder/search
ozuzuorder.unicommerce.fetch-order-url=services/rest/v1/oms/saleorder/get
ozuzuorder.unicommerce.client-id=my-trusted-client
ozuzuorder.unicommerce.grant-type=password
ozuzuorder.unicommerce.username=${COM_UNICOMMERCE_OZUZU_USER_NAME:}
ozuzuorder.unicommerce.password=${COM_UNICOMMERCE_OZUZU_USER_PASSWORD:}
ozuzuorder.unicommerce.channel=Shopify
ozuzuorder.unicommerce.facility-codes=mayagbeauty
