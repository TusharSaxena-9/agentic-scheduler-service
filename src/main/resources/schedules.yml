# Declared scheduled jobs — the source of truth for what exists in Temporal.
#
# Read on startup by ScheduleReconciler, which is CREATE-ONLY: a job here is created if it is missing
# from Temporal, and left exactly as it is if it already exists. Editing a cron, tier or policy below
# does NOT reach a schedule that already exists — delete that schedule in the Temporal UI first, then
# deploy, then unpause it. Anything not listed here is left alone.
#
# Two fields behave differently from the rest:
#
#   enabled   applies on CREATION only. Once a schedule exists its paused state belongs to whoever
#             is operating it — pausing a job during an incident must survive the next deploy. Pause
#             and unpause from the Temporal UI or CLI, not from here.
#
#   name      derives the schedule ID (<name>-schedule) and workflow ID (<name>-workflow). Renaming
#             a job orphans the old schedule rather than renaming it.
#
# Omitted policy fields inherit temporal.schedule.defaults.* from application.properties. Inheriting
# is fine; inheriting without having thought about it is what rule 5 in CLAUDE.md is about.
#
# cron is FIVE-field Temporal cron (minute hour day-of-month month day-of-week). Spring's six-field
# format with a leading seconds field and '?' does NOT port directly — see
# docs/temporal-migration/job-inventory.md for per-job translations of the incoming jobs.
#
# Entries below are kept in alphabetical order by name — position has no effect on execution
# (that's driven by each job's own cron), it's purely for finding a job in this file quickly.

scheduler:
  reconcile-on-startup: true

  jobs:
    - name: auto-assign
      workflow: com.yesmadam.schedulerservice.jobs.autoassign.workflow.AutoAssignWorkflow
      tier: standard
      cron: "*/5 0-21 * * *"
      jitter: PT0S
      run-timeout: PT15M
      enabled: false
      owner: platform
      description: Auto-assign today's unassigned orders, and queue the rest for distribution

    - name: auto-assign-tomorrow
      workflow: com.yesmadam.schedulerservice.jobs.autoassign.workflow.AutoAssignTomorrowWorkflow
      tier: standard
      cron: "*/5 16-23 * * *"
      jitter: PT0S
      run-timeout: PT15M
      enabled: false
      owner: platform
      description: Auto-assign tomorrow's unassigned orders; the only producer of D-1 distribution candidates

    - name: auto-job-distribution
      workflow: com.yesmadam.schedulerservice.jobs.autoJobDistribution.workflow.AutoJobDistributionWorkflow
      tier: light
      cron: "*/5 6-23 * * *"
      jitter: PT0S
      run-timeout: PT6M
      pause-on-failure: false
      enabled: false
      owner: platform
      description: Advance, close or escalate live job distribution rounds, then fire at most one queued order

    - name: booking-monitor
      workflow: com.yesmadam.schedulerservice.jobs.bookingmonitor.workflow.BookingMonitorWorkflow
      tier: light
      # Every minute, 09:00–23:59. Jitter is pinned off: the window this job queries is derived from
      # its firing time, so spreading the start would overlap or gap consecutive windows.
      cron: "* 9-23 * * *"
      jitter: PT0S
      run-timeout: PT5M
      enabled: false
      owner: platform
      description: Alert when Android or iOS bookings drop to zero in the trailing window

    - name: order-cancellation-charge-expiry
      workflow: com.yesmadam.schedulerservice.jobs.order.ordercancellationcharge.workflow.OrderCancellationChargeWorkflow
      tier: light
      cron: "30 0 * * *"        # translated from messagingapis' Spring cron "0 30 0 * * ?"
      # A late run is still useful: missing a tick only delays expiry by a day, it does not lose or
      # corrupt anything (the write is idempotent). Wider than the 5m default for that reason.
      catchup-window: PT2H
      # Tiny table (605 rows / 128 candidates measured on UAT); a wedge should fail fast under SKIP
      # rather than hold the slot. Placeholder — revisit once a real run has been observed.
      run-timeout: PT45M
      enabled: false
      owner: finance
      description: Expire CREATED/CHARGED order cancellation charges whose expiry window has passed

    - name: package-expiry
      workflow: com.yesmadam.schedulerservice.jobs.packageexpiry.workflow.PackageExpiryWorkflow
      tier: standard
      cron: "10 0 * * *"
      enabled: false
      owner: platform
      description: Expire active package sessions and write multi-session financial reports

    - name: passbook-mismatch
      workflow: com.yesmadam.schedulerservice.jobs.passbookmismatch.workflow.PassbookMismatchWorkflow
      tier: standard
      cron: "*/30 * * * *"
      # Short catchup: a stale audit of a window that has already passed is not worth mailing.
      catchup-window: PT5M
      run-timeout: PT15M
      # Mails ten people. A repeated failure should stop and be looked at rather than keep firing.
      pause-on-failure: true
      enabled: false
      owner: finance
      description: Audit SP passbook entries in the trailing window and mail mismatches

    - name: product-hub-live-stock-alert
      workflow: com.yesmadam.schedulerservice.jobs.producthublivestock.workflow.ProductHubLiveStockAlertWorkflow
      tier: standard
      cron: "0 10,14,18 * * *"  # 10:00, 14:00, 18:00 daily (Asia/Kolkata, via schedule.defaults.time-zone)
      # Ops wants alerts at these exact times, not spread across a window.
      jitter: PT0S
      # A stock alert for a run that fired hours late isn't worth sending.
      catchup-window: PT10M
      run-timeout: PT10M
      # Mails and WhatsApps real people. A repeated failure should stop and be looked at rather
      # than keep firing.
      pause-on-failure: true
      # Depends on PRODUCT_HUB_LIVE_STOCK_ALERT_HUB_IDS / _PRODUCT_IDS rows in tbl_settings —
      # flip on once those are populated.
      enabled: false
      owner: platform
      description: Alert by mail and WhatsApp when configured hub/product live stock drops to zero

    - name: rose-order-eligible-sp-pool
      workflow: com.yesmadam.schedulerservice.jobs.roseorder.workflow.RoseOrderEligibleSpPoolWorkflow
      tier: heavy
      cron: "0 2 * * *"
      # Longest observed run is ~31 minutes; this is roughly 2x that.
      run-timeout: PT1H
      enabled: false
      owner: platform
      description: Recompute the rose order eligible SP pool

    - name: sebal-tagging
      workflow: com.yesmadam.schedulerservice.jobs.sebaltagging.workflow.SebalTaggingWorkflow
      tier: heavy
      # Runs after rose-order-eligible-sp-pool so the day's eligibility is settled first. That
      # ordering is currently expressed only as a one-hour gap between two cron entries — it is not
      # enforced, and jitter must stay small here until it is.
      cron: "0 3 * * *"
      jitter: PT2M
      run-timeout: PT2H
      enabled: false
      owner: platform
      description: Update SEBAL sub-category SP tags

    - name: sp-not-reached-home
      workflow: com.yesmadam.schedulerservice.jobs.spNotReachedHome.workflow.SpNotReachedHomeWorkflow
      tier: light
      cron: "*/5 20-23 * * *"
      jitter: PT0S
      run-timeout: PT8M
      enabled: false
      owner: platform
      description: Track SPs who finished after 8 PM and have not returned within 300m of home

    - name: user-wallet-sum
      workflow: com.yesmadam.schedulerservice.jobs.userwalletsum.workflow.UserWalletSumWorkflow
      # Unmeasured — a single unfiltered full-table SUM over tbl_user, not chunked. Standard rather
      # than light because the table is not known to be small (unlike order-cancellation-charge's
      # measured 605 rows); revisit both this and run-timeout once a real duration is observed.
      tier: standard
      cron: "0 0 * * *"        # translated from messagingapis' Spring cron "0 0 0 * * ?"
      # A late run still produces a useful snapshot — it is "as of now", not a specific historical
      # window — so a missed midnight tick is worth catching up on rather than skipping.
      catchup-window: PT2H
      run-timeout: PT30M
      # Feeds a finance-facing balance snapshot; a repeated failure should stop and be looked at
      # rather than keep silently skipping under the default SKIP overlap policy.
      pause-on-failure: true
      enabled: false
      owner: finance
      description: Sum all user wallet balances and snapshot the total daily
