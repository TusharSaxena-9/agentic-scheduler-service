# Declared scheduled jobs — the source of truth for what exists in Temporal.
#
# Read on startup by ScheduleReconciler, which is CREATE-ONLY: a job here is created if it is missing
# from Temporal, and left exactly as it is if it already exists. Editing a cron, tier or policy below
# does NOT reach a schedule that already exists — delete that schedule in the Temporal UI first, then
# deploy, then unpause it. Anything not listed here is left alone.
#
# Two fields behave differently from the rest:
#
#   enabled   applies on CREATION only. Once a schedule exists its paused state belongs to whoever
#             is operating it — pausing a job during an incident must survive the next deploy. Pause
#             and unpause from the Temporal UI or CLI, not from here.
#
#   name      derives the schedule ID (<name>-schedule) and workflow ID (<name>-workflow). Renaming
#             a job orphans the old schedule rather than renaming it.
#
# Omitted policy fields inherit temporal.schedule.defaults.* from application.properties. Inheriting
# is fine; inheriting without having thought about it is what rule 5 in CLAUDE.md is about.
#
# cron is FIVE-field Temporal cron (minute hour day-of-month month day-of-week). Spring's six-field
# format with a leading seconds field and '?' does NOT port directly — see
# docs/temporal-migration/job-inventory.md for per-job translations of the incoming jobs.
#
# Entries below are kept in alphabetical order by name — position has no effect on execution
# (that's driven by each job's own cron), it's purely for finding a job in this file quickly.

scheduler:
  reconcile-on-startup: true

  jobs:
    - name: auto-assign
      workflow: com.yesmadam.schedulerservice.jobs.autoassign.workflow.AutoAssignWorkflow
      tier: standard
      cron: "*/5 0-21 * * *"
      jitter: PT0S
      run-timeout: PT15M
      enabled: false
      owner: platform
      description: Auto-assign today's unassigned orders, and queue the rest for distribution

    - name: auto-assign-tomorrow
      workflow: com.yesmadam.schedulerservice.jobs.autoassign.workflow.AutoAssignTomorrowWorkflow
      tier: standard
      cron: "*/5 16-23 * * *"
      jitter: PT0S
      run-timeout: PT15M
      enabled: false
      owner: platform
      description: Auto-assign tomorrow's unassigned orders; the only producer of D-1 distribution candidates

    - name: auto-job-distribution
      workflow: com.yesmadam.schedulerservice.jobs.autoJobDistribution.workflow.AutoJobDistributionWorkflow
      tier: light
      cron: "*/5 6-23 * * *"
      jitter: PT0S
      run-timeout: PT6M
      pause-on-failure: false
      enabled: false
      owner: platform
      description: Advance, close or escalate live job distribution rounds, then fire at most one queued order

    - name: billing-check-whatsapp
      workflow: com.yesmadam.schedulerservice.jobs.billingcheck.workflow.BillingCheckWorkflow
      # Window is [17:00 yesterday, 17:00 today) IST, derived from the fire time, so late runs still
      # cover the right day.
      tier: standard
      cron: "0 17 * * *"   # Asia/Kolkata via temporal.schedule.defaults.time-zone
      # A run up to 6h late is still useful; later is stale.
      catchup-window: PT6H
      # Sequential sends, ~0.5-3s each: 2k orders ~50m, 5k ~2.1h. Hitting this loses the remaining
      # customers (sends never retry). Placeholder until one real run is timed.
      run-timeout: PT3H
      # Windows tile per day, so pausing on failure would also skip tomorrow's window.
      pause-on-failure: false
      enabled: false
      owner: platform
      description: WhatsApp each customer their final bill and ask whether any service was left off it (Beauty / Beauty Salon at Home, bookings ended 17:00-17:00)

    - name: booking-monitor
      workflow: com.yesmadam.schedulerservice.jobs.bookingmonitor.workflow.BookingMonitorWorkflow
      tier: light
      # Every minute, 09:00–23:59. Jitter is pinned off: the window this job queries is derived from
      # its firing time, so spreading the start would overlap or gap consecutive windows.
      cron: "* 9-23 * * *"
      jitter: PT0S
      run-timeout: PT5M
      enabled: false
      owner: platform
      description: Alert when Android or iOS bookings drop to zero in the trailing window

    - name: commission-audit
      workflow: com.yesmadam.schedulerservice.jobs.commissionaudit.workflow.CommissionAuditWorkflow
      tier: standard
      # Two hours after the cron repo's StopJobAndDeductCommission.DeductCommissionIfAny (03:00), so
      # this audits that run's result. The target is "after 03:00 has finished", not exactly 05:00,
      # so the default jitter is fine.
      cron: "0 5 * * *"
      # The date audited is always yesterday, so a run a few hours late still reports the same
      # orders and is still worth sending. After 07:00 it overlaps the working day, so skip it.
      catchup-window: PT2H
      # One single-day query plus one mail. Covers the worst case of all retries (fetch 20m +
      # mail 5m schedule-to-close). Placeholder until a real run has been observed.
      run-timeout: PT30M
      # Mails finance. A repeated failure should stop and be looked at rather than keep firing.
      pause-on-failure: true
      enabled: false
      owner: finance
      description: Mail yesterday's completed orders whose commission was not deducted, or that have no SP

    - name: feedback-reminder
      workflow: com.yesmadam.schedulerservice.jobs.order.feedbackreminder.workflow.FeedbackReminderWorkflow
      tier: light
      # Every 5 minutes, all day. Each of the 3h/24h/48h checkpoints reads an exact 5-minute tile of
      # tbl_order keyed off this run's nominal scheduled time, so consecutive ticks must tile with no
      # gap and no overlap — jitter is pinned off, and FeedbackReminderService.TICK_INTERVAL must stay
      # in sync with this cron's period.
      cron: "*/5 * * * *"
      jitter: PT0S
      # A run that overruns must not silently drop its tile under the default SKIP: that would mean
      # every order completed in that 5-minute slice permanently never gets its reminder for that
      # checkpoint. BUFFER_ONE queues the one pending tick instead, so it still runs (with its own
      # correct nominal time) once the current run finishes.
      overlap: SCHEDULE_OVERLAP_POLICY_BUFFER_ONE
      run-timeout: PT5M
      enabled: false
      owner: platform
      description: WhatsApp feedback-reminder nudges at 3h/24h/48h after booking completion when no rating exists yet

    - name: order-cancellation-charge-expiry
      workflow: com.yesmadam.schedulerservice.jobs.order.ordercancellationcharge.workflow.OrderCancellationChargeWorkflow
      tier: light
      cron: "30 0 * * *"        # translated from messagingapis' Spring cron "0 30 0 * * ?"
      # A late run is still useful: missing a tick only delays expiry by a day, it does not lose or
      # corrupt anything (the write is idempotent). Wider than the 5m default for that reason.
      catchup-window: PT2H
      # Tiny table (605 rows / 128 candidates measured on UAT); a wedge should fail fast under SKIP
      # rather than hold the slot. Placeholder — revisit once a real run has been observed.
      run-timeout: PT45M
      enabled: false
      owner: finance
      description: Expire CREATED/CHARGED order cancellation charges whose expiry window has passed

    - name: ozuzu-order-sync
      workflow: com.yesmadam.schedulerservice.jobs.ozuzuorder.workflow.OzuzuOrderSyncWorkflow
      # Two HTTP-bound activities (a handful of Unicommerce calls, then a per-order detail fetch +
      # upsert), well under 5 minutes for the low-volume single Shopify channel this covers.
      tier: light
      cron: "*/10 * * * *"      # translated from messagingapis' Spring @Scheduled(fixedRate = 600000)
      # The lookback window is fixed at ozuzuorder.lookback-minutes regardless of how late a run
      # fires, so a longer catchup window would not recover a bigger gap after an outage.
      catchup-window: PT10M
      # Placeholder: ~2x the combined scheduleToCloseTimeout of both activities (10m + 15m) so a
      # legitimate retry sequence is never killed by the run timeout. Revisit once a real run is
      # observed.
      run-timeout: PT30M
      pause-on-failure: false
      enabled: false
      owner: platform
      description: Sync Ozuzu (Shopify, via Unicommerce) sale orders created or updated in the trailing window

    - name: package-expiry
      workflow: com.yesmadam.schedulerservice.jobs.packageexpiry.workflow.PackageExpiryWorkflow
      tier: standard
      cron: "10 0 * * *"
      enabled: false
      owner: platform
      description: Expire active package sessions and write multi-session financial reports

    - name: passbook-mismatch
      workflow: com.yesmadam.schedulerservice.jobs.passbookmismatch.workflow.PassbookMismatchWorkflow
      tier: standard
      cron: "*/30 * * * *"
      # Short catchup: a stale audit of a window that has already passed is not worth mailing.
      catchup-window: PT5M
      run-timeout: PT15M
      # Mails ten people. A repeated failure should stop and be looked at rather than keep firing.
      pause-on-failure: true
      enabled: false
      owner: finance
      description: Audit SP passbook entries in the trailing window and mail mismatches

    - name: product-hub-live-stock-alert
      workflow: com.yesmadam.schedulerservice.jobs.producthublivestock.workflow.ProductHubLiveStockAlertWorkflow
      tier: standard
      cron: "0 10,14,18 * * *"  # 10:00, 14:00, 18:00 daily (Asia/Kolkata, via schedule.defaults.time-zone)
      # Ops wants alerts at these exact times, not spread across a window.
      jitter: PT0S
      # A stock alert for a run that fired hours late isn't worth sending.
      catchup-window: PT10M
      run-timeout: PT10M
      # Mails and WhatsApps real people. A repeated failure should stop and be looked at rather
      # than keep firing.
      pause-on-failure: true
      # Depends on PRODUCT_HUB_LIVE_STOCK_ALERT_HUB_IDS / _PRODUCT_IDS rows in tbl_settings —
      # flip on once those are populated.
      enabled: false
      owner: platform
      description: Alert by mail and WhatsApp when configured hub/product live stock drops to zero

    - name: rain-delay-notification
      workflow: com.yesmadam.schedulerservice.jobs.raindelay.RainDelayWorkflow
      tier: standard
      # Every 30 minutes, all day. Each run covers the NON-OVERLAPPING tile
      cron: "*/30 * * * *"
      jitter: PT0S
      catchup-window: PT15M
      overlap: SCHEDULE_OVERLAP_POLICY_BUFFER_ONE
      run-timeout: PT25M
      pause-on-failure: true
      # Needs: rainHub row, WEATHER_API_KEY (WeatherAPI.com) and the WhatsApp template.
      enabled: false
      owner: platform
      description: Push a rain-delay heads-up via CleverTap to customers whose booking starts in this run's 30-minute slot at a rainy configured hub

    - name: rose-order-eligible-sp-pool
      workflow: com.yesmadam.schedulerservice.jobs.roseorder.workflow.RoseOrderEligibleSpPoolWorkflow
      tier: heavy
      cron: "0 2 * * *"
      # Longest observed run is ~31 minutes; this is roughly 2x that.
      run-timeout: PT1H
      enabled: false
      owner: platform
      description: Recompute the rose order eligible SP pool

    - name: sebal-tagging
      workflow: com.yesmadam.schedulerservice.jobs.sebaltagging.workflow.SebalTaggingWorkflow
      tier: heavy
      # Runs after rose-order-eligible-sp-pool so the day's eligibility is settled first. That
      # ordering is currently expressed only as a one-hour gap between two cron entries — it is not
      # enforced, and jitter must stay small here until it is.
      cron: "0 3 * * *"
      jitter: PT2M
      run-timeout: PT2H
      enabled: false
      owner: platform
      description: Update SEBAL sub-category SP tags

    - name: sp-availability-auto-on
      workflow: com.yesmadam.schedulerservice.jobs.spavailabilityautoon.workflow.SpAvailabilityAutoOnWorkflow
      tier: light
      cron: "30 0 * * *"
      catchup-window: PT6H
      pause-on-failure: false
      run-timeout: PT45M
      enabled: false
      owner: platform
      description: Turn SP availability on for active SPs whose first kit assignment was approved yesterday

    - name: sp-kit-approved-notify
      workflow: com.yesmadam.schedulerservice.jobs.spavailabilityautoon.workflow.SpKitApprovedNotifyWorkflow
      tier: light
      cron: "0 20 * * *"
      jitter: PT2M
      catchup-window: PT2H
      pause-on-failure: false
      run-timeout: PT45M
      enabled: false
      owner: platform
      description: CleverTap heads-up to active SPs whose first kit assignment was approved yesterday

    - name: sp-not-reached-home
      workflow: com.yesmadam.schedulerservice.jobs.spNotReachedHome.workflow.SpNotReachedHomeWorkflow
      tier: light
      cron: "*/5 20-23 * * *"
      jitter: PT0S
      run-timeout: PT8M
      enabled: false
      owner: platform
      description: Track SPs who finished after 8 PM and have not returned within 300m of home

    - name: sp-product-order-sync
      workflow: com.yesmadam.schedulerservice.jobs.spproductordersync.workflow.SpProductOrderSyncWorkflow
      # Two unchunked bulk UPDATEs, not measured yet; standard is the shape's default landing tier
      # per TaskQueueTier's own javadoc. Revisit once a real duration is observed.
      tier: standard
      cron: "0 */2 * * *"       # translated from messagingapis' Spring cron "0 0 */2 * * *"
      # Cumulative, not time-windowed: the WHERE clause matches whatever backlog currently exists,
      # so a missed tick isn't lost — the next one picks up everything outstanding. Default catchup
      # window is fine as-is; noted here so it reads as decided rather than overlooked.
      run-timeout: PT15M
      enabled: false
      owner: platform
      description: Increment SP inventory and flip delivered-but-unavailable products to available

    - name: sp-tomorrow-job-reminder
      workflow: com.yesmadam.schedulerservice.jobs.sptomorrowjobreminder.workflow.SpTomorrowJobReminderWorkflow
      tier: standard
      cron: "0 12 * * *"
      # "Tomorrow" is fixed at noon, not derived from fire time, so a late run within the same day
      # still targets the right date; beyond a couple of hours the reminder is stale.
      catchup-window: PT2H
      run-timeout: PT30M
      # Pushes real SPs via CleverTap. A repeated failure should stop and be looked at rather than
      # keep firing.
      pause-on-failure: true
      enabled: false
      owner: growth
      description: Push-notify (via CleverTap) SPs with a non-cancelled job booked for tomorrow

    - name: sp-wallet-sum
      workflow: com.yesmadam.schedulerservice.jobs.spwalletsum.workflow.SpWalletSumWorkflow
      # Two small aggregate reads (tbl_sp_wallet / tbl_sp_saving_wallet joined to tbl_sp) plus one
      # insert — well under 5 minutes, so light per the light/standard/heavy duration split.
      tier: light
      cron: "30 0 * * *"        # translated from messagingapis' Spring cron "0 30 0 * * ?"
      # A late run still produces a useful snapshot — it is "as of now", not a specific historical
      # window — so a missed run is worth catching up on rather than skipping.
      catchup-window: PT2H
      # Sized to cover both activities' scheduleToCloseTimeout worst case (20m + 20m) plus buffer;
      # placeholder until a real run is observed.
      run-timeout: PT45M
      # Feeds a finance-facing balance snapshot; a repeated failure should stop and be looked at
      # rather than keep silently skipping under the default SKIP overlap policy.
      pause-on-failure: false
      enabled: false
      owner: finance
      description: Sum all SP main/saving wallet balances (active and deactive) and snapshot the total daily

    - name: user-wallet-sum
      workflow: com.yesmadam.schedulerservice.jobs.userwalletsum.workflow.UserWalletSumWorkflow
      # Unmeasured — a single unfiltered full-table SUM over tbl_user, not chunked. Standard rather
      # than light because the table is not known to be small (unlike order-cancellation-charge's
      # measured 605 rows); revisit both this and run-timeout once a real duration is observed.
      tier: standard
      cron: "0 0 * * *"        # translated from messagingapis' Spring cron "0 0 0 * * ?"
      # A late run still produces a useful snapshot — it is "as of now", not a specific historical
      # window — so a missed midnight tick is worth catching up on rather than skipping.
      catchup-window: PT2H
      run-timeout: PT30M
      # Feeds a finance-facing balance snapshot; a repeated failure should stop and be looked at
      # rather than keep silently skipping under the default SKIP overlap policy.
      pause-on-failure: false
      enabled: false
      owner: finance
      description: Sum all user wallet balances and snapshot the total daily

    - name: wallet-expiry-notification-enqueue
      workflow: com.yesmadam.schedulerservice.jobs.walletexpiryreminder.workflow.WalletExpiryReminderWorkflow
      # Runs at 10 AM. The per-window query is still unbounded (no LIMIT/cursor) — that was
      tier: standard
      cron: "0 10 * * *"

      catchup-window: PT6H

      run-timeout: PT2H

      pause-on-failure: true
      enabled: false
      owner: platform
      description: Enqueue users 30/7/4/1 day(s) from wallet-balance expiry onto the wallet-expiry-notification SQS queue

    - name: coupon-whatsapp-reminder-enqueue
      workflow: com.yesmadam.schedulerservice.jobs.couponwhatsapp.workflow.CouponWhatsappReminderWorkflow
      # Runs at 9 AM daily. DEMO wiring — queue URL and WhatsApp template are placeholders (see
      # application-*.properties and cxconsumers' coupon-whatsapp consumer) until the real ones are
      # provided; left disabled until then.
      tier: standard
      cron: "0 9 * * *"
      catchup-window: PT2H
      run-timeout: PT30M
      pause-on-failure: true
      enabled: false
      owner: platform
      description: Enqueue yesterday's completed orders' claimed-but-unsent brand coupons onto the coupon-whatsapp SQS queue
