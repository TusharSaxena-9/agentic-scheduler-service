version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: temporal-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=temporal
      - MYSQL_USER=temporal
      - MYSQL_PASSWORD=temporal
      - MYSQL_DATABASE=temporal
    ports:
      - "3307:3306"   # host:container — avoids clashing with local MySQL on 3306
    volumes:
      - temporal-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptemporal"]
      interval: 5s
      timeout: 5s
      retries: 10



  temporal:
    image: temporalio/auto-setup:latest
    container_name: temporal
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_SEEDS=mysql
      - MYSQL_USER=root
      - MYSQL_PWD=temporal
      - DB_PORT=3306
      - NAMESPACES=uat
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 30


  temporal-namespace-init:
    image: temporalio/admin-tools:latest
    container_name: temporal-namespace-init
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: >
      sh -c "
      temporal operator namespace describe --address temporal:7233 --namespace uat >/dev/null 2>&1 ||
      temporal operator namespace create --address temporal:7233 --namespace uat --retention 72h
      "
    restart: "no"

  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    ports:
      - "8081:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # scheduler-service is commented out: this stack provides the Temporal server, its
  # database and the UI. Run the app from your IDE or `mvn spring-boot:run` against
  # temporal on localhost:7233, so a restart is not a container rebuild.
  # Uncomment to run everything in Docker.
  # scheduler-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     args:
  #       SPRING_PROFILE: uat
  #   container_name: scheduler-service-uat
  #   ports:
  #     - "8060:8060"
  #     - "9090:9090"
  #   environment:
  #     - TEMPORAL_SERVER_TARGET=temporal:7233
  #     - AWS_REGION=ap-south-1
  #   volumes:
  #     - ${HOME}/.aws:/root/.aws:ro
  #   depends_on:
  #     temporal-namespace-init:
  #       condition: service_completed_successfully

volumes:
  temporal-mysql-data: